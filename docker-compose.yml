services:
  zenmoney-analytics:
    image: ghcr.io/artempas/zenmoney_analytics:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # The address you open in the browser. Passkeys only work on this origin (https, or localhost).
      APP_ORIGIN: http://localhost:3000
      # Allow more than one account to be registered.
      # ALLOW_REGISTRATION: "true"
      # Set when running behind a reverse proxy (nginx, Caddy, Traefik).
      # TRUST_PROXY: "true"
      # Owner of the database files. With a host folder instead of the named volume, set these
      # to the folder owner (e.g. on Synology: PUID=1026, PGID=100; see `id` over SSH).
      # PUID: "1000"
      # PGID: "1000"
    volumes:
      - zenmoney-data:/data
      # Or a host folder:
      # - /volume1/docker/zenmoney:/data

volumes:
  zenmoney-data:
